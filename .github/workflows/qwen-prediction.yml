name: Separate Qwen prediction tests
on:
  push:
    branches: ['experiment/qwen-prediction-lora-v1']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qwen-software-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install CPU test dependencies
        run: |
          python -m pip install 'torch==2.11.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev,agents]' -r experiments/qwen_prediction/requirements.txt
      - name: Original regressions and isolated Qwen software tests
        run: python -m pytest -q tests experiments/qwen_prediction/tests
